name: Cập nhật dữ liệu pháp luật

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'legal-catalog.json'
      - '.github/workflows/main.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: legal-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cài thư viện
        run: |
          pip install requests beautifulsoup4 lxml
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils

      - name: Đọc nguồn chính thức, phân tích và kiểm định
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          cat > "$RUNNER_TEMP/legal_scan.py" <<'PY'
          from __future__ import annotations

          import concurrent.futures as cf
          import datetime as dt
          import hashlib
          import io
          import json
          import os
          import re
          import subprocess
          import tempfile
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup

          ROOT = Path(os.getenv("GITHUB_WORKSPACE", ".")).resolve()
          VN = dt.timezone(dt.timedelta(hours=7))
          MODEL = os.getenv("GEMINI_MODEL", "gemini-2.5-flash")
          KEY = os.getenv("GEMINI_API_KEY", "")

          SOURCES = [
              ("Công báo Chính phủ — văn bản mới", "https://congbao.chinhphu.vn/cac-van-ban-moi-ban-hanh.rss"),
              ("Công báo Chính phủ — số mới", "https://congbao.chinhphu.vn/cac-so-cong-bao-moi-dang.rss"),
              ("Cổng văn bản Chính phủ", "https://vanban.chinhphu.vn/"),
              ("Cục Quản lý Khám, chữa bệnh", "https://kcb.vn/van-ban/van-ban-phap-quy"),
              ("Bộ Y tế", "https://moh.gov.vn/van-ban-phap-quy"),
              ("Cục Quản lý Dược", "https://dav.gov.vn/van-ban-quan-ly.html"),
              ("Cục Hạ tầng và Thiết bị y tế", "https://imda.moh.gov.vn/van-ban-phap-quy"),
              ("Cơ sở dữ liệu quốc gia về pháp luật", "https://vbpl.vn/Pages/portal.aspx"),
              ("Bộ Công an", "https://bocongan.gov.vn/"),
          ]

          CODE_RE = re.compile(
              r"\b\d{1,4}/20\d{2}/(?:NĐ-CP|ND-CP|TT-[A-ZĐ0-9-]+|QH\d+|QĐ-[A-ZĐ0-9-]+|NQ-[A-ZĐ0-9-]+|VBHN-[A-ZĐ0-9-]+)\b",
              re.I,
          )

          RELEVANT_RE = re.compile(
              r"y tế|bệnh viện|khám bệnh|chữa bệnh|dược|thuốc|mỹ phẩm|thẩm mỹ|thiết bị|lao động|bảo hiểm|doanh nghiệp|dữ liệu|quảng cáo|phòng cháy|chữa cháy|môi trường|chất thải|hóa đơn|thuế|người tiêu dùng|an ninh|giá dịch vụ",
              re.I,
          )

          CATS = {
              "kcb",
              "antt",
              "dn",
              "pccc",
              "tb",
              "duoc",
              "mt",
              "ld",
              "dl",
              "ktd",
              "qc",
              "gia",
          }

          OFFICIAL_HOSTS = {
              "kcb.vn",
              "baochinhphu.vn",
              "vbpl.vn",
          }

          SESSION = requests.Session()
          SESSION.headers.update({
              "User-Agent": "Mozilla/5.0 LegalMonitor/3.0"
          })


          def norm(s: str) -> str:
              return re.sub(r"\s+", " ", s or "").strip()


          def canonical_code(s: str) -> str:
              return s.replace("ND-CP", "NĐ-CP").replace("nd-cp", "NĐ-CP")


          def official(url: str) -> bool:
              try:
                  p = urlparse(url)
                  h = (p.hostname or "").lower()

                  return (
                      p.scheme == "https"
                      and not p.username
                      and (
                          h.endswith(".gov.vn")
                          or h.endswith(".chinhphu.vn")
                          or h in OFFICIAL_HOSTS
                      )
                  )
              except Exception:
                  return False


          def get(url: str) -> requests.Response:
              if not official(url):
                  raise ValueError("Nguồn không thuộc cổng chính thức")

              for _ in range(6):
                  r = SESSION.get(
                      url,
                      timeout=(8, 30),
                      allow_redirects=False,
                  )

                  if r.is_redirect:
                      nxt = urljoin(
                          url,
                          r.headers.get("Location", ""),
                      )

                      if not official(nxt):
                          raise ValueError(
                              "Nguồn chuyển hướng ra ngoài cổng chính thức"
                          )

                      url = nxt
                      continue

                  r.raise_for_status()

                  if len(r.content) > 35_000_000:
                      raise ValueError("Tệp vượt 35 MB")

                  return r

              raise ValueError("Quá nhiều chuyển hướng")


          def read_json(name: str, default):
              try:
                  return json.loads(
                      (ROOT / name).read_text(
                          encoding="utf-8"
                      )
                  )
              except (
                  FileNotFoundError,
                  json.JSONDecodeError,
              ):
                  return default


          def write_json(name: str, value) -> None:
              path = ROOT / name
              tmp = path.with_suffix(
                  path.suffix + ".tmp"
              )

              tmp.write_text(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

              tmp.replace(path)


          def discover(source: tuple[str, str]) -> dict:
              name, url = source

              report = {
                  "n": name,
                  "u": url,
                  "trangThai": "ok",
                  "phatHien": [],
              }

              try:
                  r = get(url)

                  is_rss = (
                      ".rss" in url
                      or "xml"
                      in r.headers.get(
                          "content-type",
                          "",
                      ).lower()
                  )

                  soup = BeautifulSoup(
                      r.content,
                      "xml"
                      if is_rss
                      else "html.parser",
                  )

                  nodes = (
                      soup.find_all("item")
                      if is_rss
                      else soup.find_all(
                          "a",
                          href=True,
                      )
                  )

                  seen = set()

                  for node in nodes[:4000]:
                      if is_rss:
                          title_node = node.find(
                              "title"
                          )

                          title = norm(
                              title_node.get_text(
                                  " ",
                                  strip=True,
                              )
                              if title_node
                              else ""
                          )

                          link_node = node.find(
                              "link"
                          )

                          link = norm(
                              link_node.get_text(
                                  strip=True
                              )
                              if link_node
                              else ""
                          )

                      else:
                          title = norm(
                              node.get_text(
                                  " ",
                                  strip=True,
                              )
                          )

                          link = node.get(
                              "href",
                              "",
                          )

                      text = title + " " + link

                      codes = [
                          canonical_code(x)
                          for x
                          in CODE_RE.findall(text)
                      ]

                      if (
                          not codes
                          or not RELEVANT_RE.search(
                              title
                          )
                      ):
                          continue

                      link = urljoin(
                          r.url,
                          link,
                      )

                      if not official(link):
                          continue

                      for code in codes:
                          key = (
                              code,
                              link,
                          )

                          if key in seen:
                              continue

                          seen.add(key)

                          report[
                              "phatHien"
                          ].append({
                              "code": code,
                              "mota": title[:500],
                              "url": link,
                              "origin": "discovery",
                          })

                  if not soup.get_text(
                      strip=True
                  ):
                      raise ValueError(
                          "Trang rỗng"
                      )

              except Exception as e:
                  report.update(
                      trangThai="loi",
                      loi=(
                          f"{type(e).__name__}: "
                          "không đọc được nguồn"
                      ),
                  )

              return report


          def find_detail_on_page(
              r: requests.Response,
              code: str,
          ) -> str | None:

              soup = BeautifulSoup(
                  r.content,
                  "html.parser",
              )

              numyear = "/".join(
                  code.split("/")[:2]
              ).lower()

              candidates = []

              for a in soup.select(
                  "a[href]"
              ):
                  text = norm(
                      a.get_text(
                          " ",
                          strip=True,
                      )
                  )

                  href = urljoin(
                      r.url,
                      a.get("href", ""),
                  )

                  if not official(href):
                      continue

                  hay = (
                      text
                      + " "
                      + href
                  ).lower().replace(
                      "nd-cp",
                      "nđ-cp",
                  )

                  score = 0

                  if code.lower() in hay:
                      score += 10

                  if numyear in hay:
                      score += 4

                  slug = re.sub(
                      r"[^0-9a-z]+",
                      "-",
                      code.lower().replace(
                          "đ",
                          "d",
                      ),
                  )

                  if (
                      slug
                      and slug
                      in re.sub(
                          r"[^0-9a-z]+",
                          "-",
                          hay.replace(
                              "đ",
                              "d",
                          ),
                      )
                  ):
                      score += 5

                  if re.search(
                      r"\.(pdf|docx)(?:[?&#]|$)",
                      href,
                      re.I,
                  ):
                      score += 2

                  if score:
                      candidates.append(
                          (
                              score,
                              href,
                          )
                      )

              return max(
                  candidates,
                  default=(0, None),
              )[1]


          def resolve_detail(item: dict) -> str:
              code = item["code"]
              preferred = item.get(
                  "url",
                  "",
              )

              if (
                  preferred
                  and official(preferred)
              ):
                  r = get(preferred)

                  text = norm(
                      BeautifulSoup(
                          r.content,
                          "html.parser",
                      ).get_text(
                          " ",
                          strip=True,
                      )
                  )

                  detail = find_detail_on_page(
                      r,
                      code,
                  )

                  if (
                      detail
                      and detail.rstrip("/")
                      != r.url.rstrip("/")
                  ):
                      return detail

                  if (
                      code.lower()
                      in text.lower()
                      or re.search(
                          r"\.(pdf|docx)(?:[?&#]|$)",
                          r.url,
                          re.I,
                      )
                  ):
                      return r.url

              for _, url in SOURCES:
                  try:
                      r = get(url)

                      detail = (
                          find_detail_on_page(
                              r,
                              code,
                          )
                      )

                      if detail:
                          return detail

                  except Exception:
                      continue

              raise ValueError(
                  "Chưa tìm được trang chi tiết "
                  "trên nguồn chính thức"
              )


          def extract_attachment(
              data: bytes,
              url: str,
          ) -> str:

              if (
                  data[:2] == b"PK"
                  or re.search(
                      r"\.docx(?:[?&#]|$)",
                      url,
                      re.I,
                  )
              ):
                  with zipfile.ZipFile(
                      io.BytesIO(data)
                  ) as z:
                      xml = z.read(
                          "word/document.xml"
                      )

                      return BeautifulSoup(
                          xml,
                          "xml",
                      ).get_text(
                          " ",
                          strip=True,
                      )

              if (
                  data[:4] == b"%PDF"
                  or re.search(
                      r"\.pdf(?:[?&#]|$)",
                      url,
                      re.I,
                  )
              ):
                  with tempfile.NamedTemporaryFile(
                      suffix=".pdf"
                  ) as f:
                      f.write(data)
                      f.flush()

                      out = subprocess.check_output(
                          [
                              "pdftotext",
                              "-layout",
                              f.name,
                              "-",
                          ],
                          timeout=50,
                      )

                      return out.decode(
                          "utf-8",
                          errors="replace",
                      )

              return ""


          def fulltext(
              item: dict
          ) -> tuple[str, str, str, str]:

              code = item["code"]
              detail = resolve_detail(item)
              r = get(detail)

              if (
                  re.search(
                      r"\.(pdf|docx)(?:[?&#]|$)",
                      r.url,
                      re.I,
                  )
                  or r.content[:4] == b"%PDF"
                  or r.content[:2] == b"PK"
              ):
                  text = extract_attachment(
                      r.content,
                      r.url,
                  )

                  textn = norm(text)

                  if (
                      code.lower()
                      not in textn[:30000].lower()
                      or len(textn) < 1800
                      or not re.search(
                          r"Điều\s+\d+",
                          text,
                          re.I,
                      )
                  ):
                      raise ValueError(
                          "Tệp chính thức không khớp "
                          "số hiệu hoặc thiếu toàn văn"
                      )

                  return (
                      text,
                      r.url,
                      r.url,
                      hashlib.sha256(
                          r.content
                      ).hexdigest(),
                  )

              soup = BeautifulSoup(
                  r.content,
                  "html.parser",
              )

              page_text = norm(
                  soup.get_text(
                      " ",
                      strip=True,
                  )
              )

              if (
                  code.lower()
                  not in page_text.lower()
              ):
                  raise ValueError(
                      "Trang chi tiết không khớp số hiệu"
                  )

              links = [
                  urljoin(
                      r.url,
                      a.get("href", ""),
                  )
                  for a
                  in soup.select("a[href]")
              ]

              links += re.findall(
                  r'https://[^\s<>"\']+',
                  r.text,
              )

              attachments = []

              for u in links:
                  u = u.replace(
                      "&amp;",
                      "&",
                  )

                  if (
                      official(u)
                      and re.search(
                          r"\.(pdf|docx)(?:[?&#]|$)",
                          u,
                          re.I,
                      )
                  ):
                      attachments.append(u)

              numyear = "/".join(
                  code.split("/")[:2]
              ).lower()

              attachments = sorted(
                  set(attachments),
                  key=lambda u: (
                      numyear
                      not in u.lower(),
                      ".docx"
                      not in u.lower(),
                  ),
              )

              for url in attachments[:10]:
                  try:
                      rr = get(url)

                      text = extract_attachment(
                          rr.content,
                          rr.url,
                      )

                      textn = norm(text)

                      if (
                          code.lower()
                          not in textn[
                              :30000
                          ].lower()
                      ):
                          continue

                      if (
                          len(textn) < 1800
                          or not re.search(
                              r"Điều\s+\d+",
                              text,
                              re.I,
                          )
                      ):
                          continue

                      if len(text) > 1_600_000:
                          raise ValueError(
                              "Toàn văn vượt giới hạn "
                              "phân tích an toàn"
                          )

                      return (
                          text,
                          rr.url,
                          r.url,
                          hashlib.sha256(
                              rr.content
                          ).hexdigest(),
                      )

                  except (
                      requests.RequestException,
                      KeyError,
                      zipfile.BadZipFile,
                      subprocess.SubprocessError,
                      ValueError,
                  ):
                      continue

              if (
                  len(page_text) > 6000
                  and len(
                      re.findall(
                          r"Điều\s+\d+",
                          page_text,
                          re.I,
                      )
                  ) >= 3
              ):
                  data = page_text.encode(
                      "utf-8"
                  )

                  return (
                      page_text,
                      r.url,
                      r.url,
                      hashlib.sha256(
                          data
                      ).hexdigest(),
                  )

              raise ValueError(
                  "Chưa lấy được toàn văn đúng số hiệu "
                  "từ nguồn chính thức"
              )


          def gemini(prompt: str) -> dict:
              if not KEY:
                  raise ValueError(
                      "Thiếu GEMINI_API_KEY "
                      "trong GitHub Secrets"
                  )

              url = (
                  "https://generativelanguage."
                  "googleapis.com/v1beta/models/"
                  f"{MODEL}:generateContent"
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0,
                      "responseMimeType":
                          "application/json",
                  },
              }

              r = SESSION.post(
                  url,
                  headers={
                      "x-goog-api-key": KEY
                  },
                  json=payload,
                  timeout=(10, 180),
              )

              if r.status_code != 200:
                  raise ValueError(
                      f"AI HTTP {r.status_code}"
                  )

              data = r.json()

              raw = "".join(
                  p.get("text", "")
                  for p
                  in data[
                      "candidates"
                  ][0][
                      "content"
                  ][
                      "parts"
                  ]
              )

              return json.loads(raw)


          def validate_candidate(
              result: dict,
              text: str,
          ) -> dict:

              if (
                  result.get("cat")
                  not in CATS
                  or result.get("tier")
                  not in (1, 2, 3)
              ):
                  raise ValueError(
                      "Sai nhóm hoặc mức ưu tiên"
                  )

              if (
                  result.get("lienQuan")
                  is not True
              ):
                  raise ValueError(
                      "Không xác định áp dụng trực tiếp "
                      "cho bệnh viện thẩm mỹ tư nhân"
                  )

              unknowns = (
                  result.get("unknowns")
                  or []
              )

              if unknowns:
                  raise ValueError(
                      "Còn điểm pháp lý chưa giải quyết; "
                      "không xuất bản"
                  )

              eff = norm(
                  result.get(
                      "effectiveStatus",
                      "",
                  )
              )

              if (
                  not eff
                  or re.search(
                      r"chưa|không rõ|không xác định|cần kiểm tra",
                      eff,
                      re.I,
                  )
              ):
                  raise ValueError(
                      "Chưa xác định chắc "
                      "tình trạng hiệu lực"
                  )

              claims = (
                  result.get("claims")
                  or []
              )

              if len(claims) < 2:
                  raise ValueError(
                      "Thiếu dẫn chứng"
                  )

              kinds = {
                  "essence",
                  "duty",
                  "risk",
                  "effective",
                  "fine",
                  "relation",
              }

              normalized_text = norm(text)

              for c in claims:
                  if not all(
                      isinstance(
                          c.get(k),
                          str,
                      )
                      and c[k].strip()
                      for k
                      in (
                          "kind",
                          "text",
                          "article",
                          "quote",
                      )
                  ):
                      raise ValueError(
                          "Thiếu trường dẫn chứng"
                      )

                  if c["kind"] not in kinds:
                      raise ValueError(
                          "Sai loại nhận định"
                      )

                  quote = norm(
                      c["quote"]
                  )

                  if (
                      len(quote) < 25
                      or quote
                      not in normalized_text
                  ):
                      raise ValueError(
                          "Trích dẫn không khớp "
                          "nguyên văn"
                      )

                  refs = re.findall(
                      r"Điều\s+\d+",
                      c["article"],
                      re.I,
                  )

                  if (
                      not refs
                      or any(
                          norm(x).lower()
                          not in normalized_text.lower()
                          for x in refs
                      )
                  ):
                      raise ValueError(
                          "Dẫn chiếu điều khoản "
                          "không tồn tại trong toàn văn"
                      )

                  if (
                      c["kind"] == "fine"
                      and not all(
                          norm(
                              c.get(
                                  k,
                                  "",
                              )
                          )
                          for k
                          in (
                              "subject",
                              "behavior",
                              "conditions",
                          )
                      )
                  ):
                      raise ValueError(
                          "Mức phạt thiếu đối tượng, "
                          "hành vi hoặc điều kiện"
                      )

              if not any(
                  c["kind"] == "essence"
                  for c in claims
              ):
                  raise ValueError(
                      "Thiếu bản chất có căn cứ"
                  )

              if not any(
                  c["kind"] == "duty"
                  for c in claims
              ):
                  raise ValueError(
                      "Thiếu nghĩa vụ hoặc việc "
                      "phải làm có căn cứ"
                  )

              if not any(
                  c["kind"] == "risk"
                  for c in claims
              ):
                  raise ValueError(
                      "Thiếu rủi ro có căn cứ"
                  )

              if not any(
                  c["kind"] == "effective"
                  for c in claims
              ):
                  raise ValueError(
                      "Thiếu căn cứ hiệu lực"
                  )

              for code in (
                  result.get("replaces")
                  or []
              ) + (
                  result.get("amends")
                  or []
              ):
                  if (
                      not isinstance(
                          code,
                          str,
                      )
                      or not CODE_RE.search(
                          code
                      )
                  ):
                      raise ValueError(
                          "Quan hệ văn bản "
                          "sai định dạng"
                      )

                  if (
                      canonical_code(
                          CODE_RE.search(
                              code
                          ).group(0)
                      ).lower()
                      not in normalized_text.lower()
                  ):
                      raise ValueError(
                          "Quan hệ văn bản "
                          "không xuất hiện "
                          "trong toàn văn"
                      )

              for step in (
                  result.get("steps")
                  or []
              ):
                  if (
                      not isinstance(
                          step,
                          dict,
                      )
                      or not all(
                          isinstance(
                              step.get(k),
                              str,
                          )
                          and step[k].strip()
                          for k
                          in (
                              "action",
                              "owner",
                              "evidence",
                              "when",
                          )
                      )
                  ):
                      raise ValueError(
                          "Khuyến nghị vận hành "
                          "thiếu trường"
                      )

              return result


          def analyze(
              item: dict,
              text: str,
          ) -> dict:

              prompt = f"""
          Vai trò: chuyên gia pháp lý vận hành bệnh viện thẩm mỹ tư nhân tại Hà Nội. Nhiệm vụ là tạo nội dung sẵn dùng cho giám đốc; người dùng KHÔNG phải tự kiểm tra lại.

          QUY TẮC CỨNG:
          - Chỉ được dùng TOÀN VĂN bên dưới. Không dùng trí nhớ, không tự bổ sung luật khác, không suy đoán.
          - Mỗi nhận định pháp lý phải có quote là đoạn trích NGUYÊN VĂN có thật trong toàn văn và article ghi đúng Điều/khoản/điểm.
          - Phân biệt rõ đối tượng cá nhân/tổ chức, bệnh viện tư nhân/công lập, điều kiện, ngoại lệ, chuyển tiếp, ngày ban hành và ngày hiệu lực.
          - Không biến mức phạt tối đa của lĩnh vực thành mức phạt cho một hành vi cụ thể.
          - Nếu còn bất kỳ điểm trọng yếu nào chưa đủ căn cứ thì ghi vào unknowns; hệ thống sẽ KHÔNG xuất bản mục đó.
          - steps là khuyến nghị vận hành thực tế, không được bịa thời hạn luật định.
          - replaces/amends chỉ ghi mã văn bản thực sự bị thay thế/bãi bỏ hoặc sửa đổi trong chính văn bản này.

          Trả đúng JSON:
          {{
           "title":"tên ngắn gọn, chính xác",
           "cat":"kcb|antt|dn|pccc|tb|duoc|mt|ld|dl|ktd|qc|gia",
           "tier":1,
           "lienQuan":true,
           "effectiveDate":"dd/mm/yyyy hoặc mô tả chính xác",
           "effectiveStatus":"Có hiệu lực|Hết hiệu lực toàn bộ|Hiệu lực một phần|Sắp có hiệu lực",
           "claims":[
             {{
               "kind":"essence|duty|risk|effective|fine|relation",
               "text":"...",
               "article":"Điều ... khoản ...",
               "quote":"...",
               "subject":"chỉ bắt buộc với fine",
               "behavior":"chỉ bắt buộc với fine",
               "conditions":"chỉ bắt buộc với fine"
             }}
           ],
           "steps":[
             {{
               "action":"...",
               "owner":"...",
               "evidence":"...",
               "when":"..."
             }}
           ],
           "replaces":["mã văn bản"],
           "amends":["mã văn bản"],
           "unknowns":[]
          }}

          Mã cần phân tích: {item['code']}
          Tiêu đề gợi ý (chỉ để định hướng, không phải căn cứ): {item.get('title','')}

          TOÀN VĂN:
          {text}
          """

              return validate_candidate(
                  gemini(prompt),
                  text,
              )


          def audit(
              item: dict,
              text: str,
              candidate: dict,
          ) -> None:

              prompt = f"""
          Bạn là kiểm định viên pháp lý độc lập. Hãy CỐ GẮNG BÁC BỎ bản tóm tắt ứng viên dưới đây bằng cách đối chiếu với toàn văn.

          Chỉ phê duyệt nếu MỌI nhận định, hiệu lực, quan hệ sửa đổi/thay thế, đối tượng áp dụng và mức phạt đều được toàn văn hỗ trợ trực tiếp, không suy rộng.

          Trả đúng JSON:
          {{
            "approved": true|false,
            "problems": ["..."]
          }}

          Chỉ approved=true khi problems rỗng.

          Mã văn bản: {item['code']}

          ỨNG VIÊN:
          {json.dumps(candidate, ensure_ascii=False)}

          TOÀN VĂN:
          {text}
          """

              result = gemini(prompt)

              if (
                  result.get("approved")
                  is not True
                  or (
                      result.get("problems")
                      or []
                  )
              ):
                  raise ValueError(
                      "Kiểm định vòng 2 không đạt"
                  )


          def public_record(
              item: dict,
              result: dict,
              text_url: str,
              page_url: str,
              digest: str,
              now: dt.datetime,
          ) -> dict:

              claims = result["claims"]

              by = lambda k: [
                  f"{c['text']} ({c['article']})"
                  for c in claims
                  if c["kind"] == k
              ]

              effective = result.get(
                  "effectiveStatus",
                  "",
              )

              date = result.get(
                  "effectiveDate",
                  "",
              )

              eff = " · ".join(
                  x
                  for x in (
                      effective,
                      date,
                  )
                  if x
              )

              return {
                  "verificationVersion": 3,
                  "verified": True,
                  "code": item["code"],
                  "title": result["title"],
                  "cat": result["cat"],
                  "tier": result["tier"],
                  "lienQuan": True,
                  "checkedAt": now.isoformat(),
                  "sourcePage": page_url,
                  "sourceFile": text_url,
                  "sourceHash": digest,
                  "coToanVan": True,
                  "claims": claims,
                  "steps":
                      result.get("steps")
                      or [],
                  "essence":
                      " ".join(
                          by("essence")
                      ),
                  "duties":
                      by("duty"),
                  "risks":
                      by("risk"),
                  "eff": eff,
                  "fine": "",
                  "fineNote": "",
                  "thayThe": [
                      canonical_code(
                          CODE_RE.search(
                              x
                          ).group(0)
                      )
                      for x
                      in (
                          result.get(
                              "replaces"
                          )
                          or []
                      )
                      if CODE_RE.search(x)
                  ],
                  "suaDoi": [
                      canonical_code(
                          CODE_RE.search(
                              x
                          ).group(0)
                      )
                      for x
                      in (
                          result.get(
                              "amends"
                          )
                          or []
                      )
                      if CODE_RE.search(x)
                  ],
                  "notes":
                      "Nội dung đã qua hai vòng "
                      "đối chiếu tự động trên toàn văn "
                      "từ nguồn chính thức và kiểm tra "
                      "trích dẫn nguyên văn.",
                  "url": page_url,
              }


          def main() -> None:
              now = dt.datetime.now(
                  dt.timezone.utc
              )

              old = read_json(
                  "vanban-moi.json",
                  [],
              )

              accepted = {
                  v["code"]: v
                  for v in old
                  if isinstance(v, dict)
                  and v.get(
                      "verificationVersion"
                  ) == 3
                  and v.get(
                      "verified"
                  ) is True
                  and v.get("code")
              }

              pending_list = read_json(
                  "pending.json",
                  [],
              )

              pending = {
                  v["code"]: v
                  for v in pending_list
                  if isinstance(v, dict)
                  and v.get("code")
              }

              for c in read_json(
                  "legal-catalog.json",
                  [],
              ):
                  code = canonical_code(
                      c.get(
                          "code",
                          "",
                      )
                  )

                  if not code:
                      continue

                  c = {
                      **c,
                      "code": code,
                      "origin": "catalog",
                  }

                  prev = accepted.get(
                      code
                  )

                  recheck = True

                  if (
                      prev
                      and prev.get(
                          "checkedAt"
                      )
                  ):
                      try:
                          age = (
                              now
                              - dt.datetime.fromisoformat(
                                  prev[
                                      "checkedAt"
                                  ].replace(
                                      "Z",
                                      "+00:00",
                                  )
                              )
                          )

                          recheck = (
                              age
                              > dt.timedelta(
                                  days=7
                              )
                          )

                      except Exception:
                          recheck = True

                  if (
                      not prev
                      or recheck
                  ):
                      pending[code] = {
                          **pending.get(
                              code,
                              {},
                          ),
                          **c,
                          "recheck":
                              bool(prev),
                      }

              with cf.ThreadPoolExecutor(
                  max_workers=5
              ) as pool:
                  reports = list(
                      pool.map(
                          discover,
                          SOURCES,
                      )
                  )

              for s in reports:
                  for item in s.get(
                      "phatHien",
                      [],
                  ):
                      code = canonical_code(
                          item["code"]
                      )

                      item["code"] = code

                      if code not in accepted:
                          pending[code] = {
                              **pending.get(
                                  code,
                                  {},
                              ),
                              **item,
                          }

              def rank(x: dict):
                  return (
                      2
                      if x.get(
                          "recheck"
                      )
                      else 0,
                      0
                      if x.get(
                          "origin"
                      ) == "discovery"
                      else 1,
                      x.get(
                          "lastAttempt",
                          "",
                      ),
                  )

              queue = sorted(
                  pending.values(),
                  key=rank,
              )

              deadline = (
                  time.monotonic()
                  + 25 * 60
              )

              processed = 0

              for item in queue[:12]:
                  if (
                      time.monotonic()
                      > deadline
                  ):
                      break

                  code = item.get(
                      "code"
                  )

                  if not code:
                      continue

                  try:
                      (
                          text,
                          file_url,
                          page_url,
                          digest,
                      ) = fulltext(item)

                      result = analyze(
                          item,
                          text,
                      )

                      audit(
                          item,
                          text,
                          result,
                      )

                      accepted[code] = (
                          public_record(
                              item,
                              result,
                              file_url,
                              page_url,
                              digest,
                              now,
                          )
                      )

                      pending.pop(
                          code,
                          None,
                      )

                  except Exception as e:
                      item["reason"] = (
                          str(e)
                          if isinstance(
                              e,
                              ValueError,
                          )
                          else (
                              f"{type(e).__name__}: "
                              "chưa hoàn tất"
                          )
                      )

                      item[
                          "lastAttempt"
                      ] = now.isoformat()

                      pending[code] = item

                  processed += 1

              for code, v in list(
                  accepted.items()
              ):
                  try:
                      age = (
                          now
                          - dt.datetime.fromisoformat(
                              v[
                                  "checkedAt"
                              ].replace(
                                  "Z",
                                  "+00:00",
                              )
                          )
                      )

                      if (
                          age
                          > dt.timedelta(
                              days=45
                          )
                      ):
                          accepted.pop(
                              code,
                              None,
                          )

                  except Exception:
                      accepted.pop(
                          code,
                          None,
                      )

              ok = sum(
                  s.get(
                      "trangThai"
                  ) == "ok"
                  for s in reports
              )

              local = now.astimezone(VN)

              status = {
                  "schemaVersion": 3,
                  "checkedAt":
                      now.isoformat(),
                  "ngay":
                      local.strftime(
                          "%d/%m/%Y"
                      ),
                  "gio":
                      local.strftime(
                          "%H:%M %d/%m/%Y"
                      ),
                  "status":
                      "ready"
                      if ok
                      >= max(
                          1,
                          len(reports) - 2,
                      )
                      else "degraded",
                  "published":
                      len(accepted),
                  "sourcesOk": ok,
                  "sourcesTotal":
                      len(reports),
                  "processed":
                      processed,
                  "message":
                      "Dữ liệu pháp lý đã được "
                      "đồng bộ từ các nguồn "
                      "chính thức.",
              }

              write_json(
                  "vanban-moi.json",
                  sorted(
                      accepted.values(),
                      key=lambda v: (
                          v.get(
                              "tier",
                              2,
                          ),
                          v.get(
                              "cat",
                              "",
                          ),
                          v.get(
                              "code",
                              "",
                          ),
                      ),
                  ),
              )

              write_json(
                  "pending.json",
                  sorted(
                      pending.values(),
                      key=lambda v:
                          v.get(
                              "code",
                              "",
                          ),
                  ),
              )

              write_json(
                  "capnhat.json",
                  status,
              )


          if __name__ == "__main__":
              main()

          PY

          python "$RUNNER_TEMP/legal_scan.py"

      - name: Lưu dữ liệu đã kiểm định
        run: |
          git config user.name 'legal-monitor[bot]'
          git config user.email 'legal-monitor@users.noreply.github.com'

          git add capnhat.json vanban-moi.json pending.json

          if ! git diff --cached --quiet; then
            git commit -m 'Update verified legal data'
            git pull --rebase
            git push
          fi

      - name: Chuẩn bị web
        run: |
          rm -rf public
          mkdir -p public

          cp index.html public/
          cp sw.js public/
          cp manifest.json public/
          cp icon-180.png public/
          cp icon-192.png public/
          cp icon-512.png public/

          cp capnhat.json public/
          cp vanban-moi.json public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - uses: actions/deploy-pages@v4
        id: deployment
