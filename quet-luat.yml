name: Quét văn bản pháp luật

on:
  schedule:
    # Giờ ghi theo giờ quốc tế. Việt Nam nhanh hơn 7 tiếng.
    # Chạy 4 lần mỗi ngày. Kho công khai nên GitHub Actions không giới hạn số phút, không tốn phí.
    - cron: "0 22 * * *"    #  5 giờ sáng giờ Việt Nam
    - cron: "0 4 * * *"     # 11 giờ trưa giờ Việt Nam
    - cron: "0 10 * * *"    #  5 giờ chiều giờ Việt Nam
    - cron: "0 16 * * *"    # 11 giờ đêm giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Cần cho nhánh dự phòng khi văn bản chỉ có bản PDF mà không có bản DOCX.
      # unzip dùng cho DOCX đã có sẵn trên máy chạy nên không phải cài.
      - name: Cài công cụ đọc PDF
        continue-on-error: true
        run: sudo apt-get install -y -qq poppler-utils < /dev/null > /dev/null 2>&1 || echo "Không cài được poppler-utils, sẽ chỉ đọc bản DOCX."

      - name: Quét và phân tích
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > /tmp/quet.mjs <<'SCRIPT'
          import { readFileSync, writeFileSync, existsSync } from "node:fs";
          import { execFileSync } from "node:child_process";

          /* ---------------- PHẦN 1: QUÉT ---------------- */

          /* ---- NGUỒN RSS: xương sống của việc cập nhật ----
             Công báo Chính phủ phát hành hai kênh RSS công khai, miễn phí. Kênh "văn bản mới
             ban hành" là thứ đáng giá nhất: mọi văn bản quy phạm pháp luật trung ương đều phải
             đăng Công báo, và RSS là XML có cấu trúc nên không gãy khi họ đổi giao diện, lại
             kèm TIÊU ĐỀ ĐẦY ĐỦ của văn bản thay vì đoạn chữ cắt ngang như khi cào trang HTML.
             Tiêu đề đầy đủ giúp lọc chính xác hơn nhiều và giúp trợ lý AI phân tích đúng hơn. */
          const RSS = [
            { n: "Công báo Chính phủ — văn bản mới ban hành", u: "https://congbao.chinhphu.vn/cac-van-ban-moi-ban-hanh.rss" },
            { n: "Công báo Chính phủ — số công báo mới đăng",  u: "https://congbao.chinhphu.vn/cac-so-cong-bao-moi-dang.rss" }
          ];

          /* ---- NGUỒN HTML: bổ sung cho RSS ----
             Vẫn giữ vì các cổng chuyên ngành thường đăng thông tư sớm hơn Công báo vài ngày
             tới vài tuần. moh.gov.vn đang timeout kéo dài nên thay bằng hệ thống tra cứu văn
             bản của chính Bộ Y tế, vốn là nơi họ thật sự đăng văn bản. */
          const NGUON = [
            { n: "Cục Quản lý Khám, chữa bệnh",        u: "https://kcb.vn/van-ban/van-ban-phap-quy" },
            { n: "Cổng văn bản Chính phủ",             u: "https://vanban.chinhphu.vn/" },
            { n: "Bộ Y tế — Hệ thống tra cứu văn bản", u: "https://emohbackup.moh.gov.vn/publish/home" },
            { n: "Cục Hạ tầng và Thiết bị y tế",       u: "https://imda.moh.gov.vn/van-ban-phap-quy" },
            { n: "Xây dựng chính sách — Chính phủ",    u: "https://xaydungchinhsach.chinhphu.vn/" },
            { n: "Bộ Công an",                         u: "https://bocongan.gov.vn/" },
            { n: "Thư viện pháp luật — Y tế mới",      u: "https://thuvienphapluat.vn/van-ban-moi/The-thao-Y-te" },
            { n: "Cổng đăng ký doanh nghiệp quốc gia", u: "https://dangkykinhdoanh.gov.vn/" }
          ];

          const CODERE = /\d{1,4}\/20(?:2[4-9]|3\d)\/(?:NĐ-CP|ND-CP|TT-BYT|TT-BCA|TT-BVHTTDL|TT-BTNMT|TT-BNNMT|TT-BLĐTBXH|TT-BTC|QH15|QH16|QĐ-TTg|QĐ-BYT|NQ-CP|VBHN-[A-ZĐ]{2,8}(?:-[A-ZĐ]{2,8})?)/g;
          const LOI  = /(thẩm mỹ|khám bệnh|chữa bệnh|người bệnh|bệnh viện|cơ sở y tế|hồ sơ bệnh án|bệnh án điện tử|giấy phép hành nghề|hành nghề y|mỹ phẩm|thiết bị y tế|trang thiết bị y tế|dược phẩm|Luật Dược|kinh doanh dược|đăng ký lưu hành thuốc|kê đơn|đơn thuốc|kiểm soát đặc biệt|gây nghiện|hướng thần|tiền chất|gây mê|gây tê|kiểm soát nhiễm khuẩn|chất thải y tế|nước thải y tế|quảng cáo|phòng cháy|chữa cháy|cứu nạn|dữ liệu cá nhân|an toàn vệ sinh lao động|Luật Doanh nghiệp|chủ sở hữu hưởng lợi|bảo hiểm y tế|Bộ Y tế|Sở Y tế|an ninh, trật tự|niêm yết giá|kê khai giá|hóa đơn điện tử|bệnh án điện tử|kiểm soát nhiễm khuẩn|sự cố y khoa|lưu trữ hồ sơ|bảo hiểm trách nhiệm)/i;
          /* Nhóm sau đây thuộc ngành khác hoặc thuộc khối y tế công lập, không chạm tới một
             bệnh viện thẩm mỹ tư nhân. Lọc thẳng ở đây để khỏi tốn lượt gọi AI — lần chạy #6
             đã đốt cả 5 lượt vào loại văn bản này (trạm y tế xã, định mức máy móc công lập,
             mã số hàng hoá xuất nhập khẩu). */
          const CAM  = /(viễn thông|trồng trọt|bảo vệ thực vật|thủy sản|chăn nuôi|lâm nghiệp|đường sắt|đường bộ|đường thủy|hàng không|hàng hải|giáo dục|đại học|ngân hàng|chứng khoán|hải quan|đất đai|khoáng sản|dầu khí|điện lực|thủy lợi|du lịch|thể thao|quốc phòng|biên phòng|tôn giáo|quy hoạch đô thị|công nghệ lạc hậu|ươm tạo công nghệ|đăng ký hộ kinh doanh|biểu mẫu|giấy phép viễn thông|Sở Nông nghiệp|Trạm Y tế|trạm y tế|y tế xã|y tế cơ sở|tuyến xã|đặc khu|thôn bản|định mức sử dụng máy móc|tiêu chuẩn, định mức|tài sản công|xuất khẩu, nhập khẩu|mã số hàng hóa|đầu tư công|ngân sách nhà nước|viên chức|công chức)/i;
          const LOAI = /(Nghị định|Thông tư|Luật|Quyết định|Nghị quyết|Văn bản hợp nhất)[^]{0,45}$/;
          const laYTe = c => /TT-BYT/.test(c);
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36";

          let DA_CO = new Set();
          try { DA_CO = new Set(readFileSync("index.html","utf8").match(new RegExp(CODERE.source,"g")) || []); }
          catch (e) { console.log("Không đọc được index.html: " + e.message); }

          let DA_PHANTICH = [];
          try { if(existsSync("vanban-moi.json")) DA_PHANTICH = JSON.parse(readFileSync("vanban-moi.json","utf8")) || []; }
          catch (e) { DA_PHANTICH = []; }
          if(!Array.isArray(DA_PHANTICH)) DA_PHANTICH = [];
          DA_PHANTICH.forEach(v => v && v.code && DA_CO.add(v.code));

          function locVanBan(html){
            try{
              const sach = String(html)
                .replace(/<script[\s\S]*?<\/script>/gi," ").replace(/<style[\s\S]*?<\/style>/gi," ")
                .replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ");
              const ra = new Map();
              const re = new RegExp(CODERE.source,"g");
              let m;
              while((m = re.exec(sach)) !== null){
                const code = m[0];
                if(DA_CO.has(code) || ra.has(code)) continue;
                let sau = sach.slice(m.index+code.length, m.index+code.length+170);
                const kt = sau.search(/(Nghị định|Thông tư|Luật|Quyết định|Nghị quyết|Văn bản hợp nhất)\s+(số\s+)?\d/);
                if(kt > 0) sau = sau.slice(0,kt);
                if(CAM.test(sau)) continue;
                if(!laYTe(code) && !LOI.test(sau)) continue;
                const truoc = sach.slice(Math.max(0,m.index-50), m.index);
                const loai = (truoc.match(LOAI) || [""])[0];
                ra.set(code, (loai+code+sau).trim().slice(0,175));
                if(ra.size >= 8) break;
              }
              return [...ra.entries()].map(([code,mota]) => ({code,mota}));
            }catch(e){ return []; }
          }

          /* ---- ĐỌC RSS ----
             Lấy nội dung một thẻ trong khối item, gỡ CDATA và thực thể HTML. Viết tay thay vì
             dùng thư viện vì workflow không cài gói ngoài, giữ nguyên tắc không phụ thuộc. */
          function goTag(khoi, ten){
            const m = khoi.match(new RegExp("<" + ten + "[^>]*>([\\s\\S]*?)<\\/" + ten + ">", "i"));
            if(!m) return "";
            return m[1]
              .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, "$1")
              .replace(/<[^>]+>/g, " ")
              .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
              .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&nbsp;/g, " ")
              .replace(/\s+/g, " ").trim();
          }

          /* Đường dẫn của Công báo viết số hiệu ở dạng khác hẳn: thong-tu-so-18-2026-tt-byt
             thay vì 18/2026/TT-BYT. Chạy thử với dữ liệu mẫu cho thấy nếu chỉ dò dạng có gạch
             chéo thì bỏ sót phần lớn văn bản, vì tiêu đề Công báo thường không chứa số hiệu mà
             đường dẫn mới chứa. Hàm này dựng lại số hiệu chuẩn từ đường dẫn. */
          const MAP_LOAI = {
            "nd-cp":"NĐ-CP", "tt-byt":"TT-BYT", "tt-bca":"TT-BCA", "tt-bvhttdl":"TT-BVHTTDL",
            "tt-btnmt":"TT-BTNMT", "tt-bnnmt":"TT-BNNMT", "tt-bldtbxh":"TT-BLĐTBXH",
            "tt-btc":"TT-BTC", "qh15":"QH15", "qh16":"QH16", "qd-ttg":"QĐ-TTg",
            "qd-byt":"QĐ-BYT", "nq-cp":"NQ-CP"
          };
          function maTuLink(link){
            const m = String(link).toLowerCase()
              .match(/(\d{1,4})-(20(?:2[4-9]|3\d))-(nd-cp|tt-byt|tt-bca|tt-bvhttdl|tt-btnmt|tt-bnnmt|tt-bldtbxh|tt-btc|qh15|qh16|qd-ttg|qd-byt|nq-cp)/);
            if(!m) return "";
            return m[1] + "/" + m[2] + "/" + (MAP_LOAI[m[3]] || m[3].toUpperCase());
          }

          /* Trả về các mục RSS đáng quan tâm. Khác với cào HTML, ở đây có tiêu đề đầy đủ nên
             lọc theo nội dung chính xác hơn hẳn. Mục không nhận diện được số hiệu văn bản thì
             bỏ qua nhưng vẫn đếm, để log cho biết có đang bỏ sót nhiều hay không. */
          function locRSS(xml){
            const nhan = [], boSot = [];
            const khoi = String(xml).split(/<item[\s>]/i).slice(1);
            for(const it of khoi){
              const tieuDe = goTag(it, "title");
              const mo     = goTag(it, "description");
              const link   = goTag(it, "link") || goTag(it, "guid");
              const noiDung = (tieuDe + " " + mo).replace(/\s+/g, " ").trim();
              if(noiDung.length < 15) continue;
              if(CAM.test(noiDung)) continue;

              const tim = (noiDung + " " + link).match(new RegExp(CODERE.source, "g")) || [];
              const code = tim[0] || maTuLink(link);

              if(!code){
                if(LOI.test(noiDung)) boSot.push(noiDung.slice(0, 90));
                continue;
              }
              if(!laYTe(code) && !LOI.test(noiDung)) continue;
              if(nhan.some(x => x.code === code)) continue;
              nhan.push({ code, mota: noiDung.slice(0, 300), link });
            }
            return { nhan, boSot };
          }

          /* ============================================================
             LẤY TOÀN VĂN — phần quyết định chất lượng thẻ tự động
             ------------------------------------------------------------
             Thẻ viết tay chính xác vì người viết đọc bản gốc. Thẻ tự động trước đây chỉ có
             mỗi tiêu đề nên trợ lý AI buộc phải đoán, và đoán về pháp luật là bịa.
             Trang chi tiết của Công báo cho hai thứ quý:
               1. Bảng thuộc tính chuẩn: số hiệu, cơ quan ban hành, ngày ban hành, người ký.
                  Đây là DỮ KIỆN, lấy thẳng, không cho AI đụng vào.
               2. Link tải bản DOCX và PDF của toàn văn.
             DOCX được ưu tiên vì nó chỉ là tệp ZIP chứa word/document.xml, giải nén bằng unzip
             có sẵn trên máy chạy, chữ sạch, không phải bản quét ảnh. PDF là phương án dự phòng.
             ============================================================ */

          function chayLenh(lenh, tham, gioiHan){
            return execFileSync(lenh, tham, {
              encoding: "utf8", maxBuffer: (gioiHan || 40) * 1024 * 1024,
              stdio: ["ignore", "pipe", "pipe"], timeout: 60000
            });
          }

          /* Gỡ thẻ HTML và thực thể, trả về chữ thuần. */
          function boThe(s){
            return String(s)
              .replace(/<script[\s\S]*?<\/script>/gi, " ")
              .replace(/<style[\s\S]*?<\/style>/gi, " ")
              .replace(/<[^>]+>/g, " ")
              .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
              .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&nbsp;/g, " ")
              .replace(/\s+/g, " ").trim();
          }

          /* Đọc một ô trong bảng thuộc tính. Làm trên bản đã gỡ thẻ cho đỡ phụ thuộc cấu trúc
             HTML, nhưng gỡ thẻ xong thì mất luôn ranh giới giữa các ô, nên phải tự cắt: lấy
             đoạn sau nhãn cần tìm rồi dừng ngay khi gặp nhãn kế tiếp.
             Chạy thử bắt được lỗi này — bản đầu không cắt nên trường Số hiệu nuốt luôn cả cơ
             quan ban hành, ngày ban hành và người ký vào làm một. */
          const NHAN_TT = ["Số hiệu", "Loại văn bản", "Cơ quan ban hành", "Ngày ban hành",
                           "Ngày hiệu lực", "Ngày đăng công báo", "Người ký", "Số công báo",
                           "Công báo", "Trích yếu", "Nguồn", "Tình trạng"];
          function layThuocTinh(chu, nhan){
            const vt = chu.search(new RegExp(nhan + "\\s*:", "i"));
            if(vt < 0) return "";
            let sau = chu.slice(vt).replace(new RegExp("^" + nhan + "\\s*:\\s*", "i"), "");
            let het = sau.length;
            for(const n of NHAN_TT){
              if(n.toLowerCase() === nhan.toLowerCase()) continue;
              const p = sau.search(new RegExp(n + "\\s*:", "i"));
              if(p > 0 && p < het) het = p;
            }
            return sau.slice(0, het).replace(/\s+/g, " ").trim().slice(0, 90);
          }

          /* Văn bản dài thì cắt có chủ đích thay vì cắt cụt đầu: giữ phần mở đầu (căn cứ, phạm
             vi, đối tượng áp dụng), giữ phần cuối (điều khoản thi hành, hiệu lực, bãi bỏ) và
             nhặt thêm các đoạn có từ khóa liên quan bệnh viện thẩm mỹ. */
          function catThongMinh(text, tran){
            const t = String(text).replace(/\s+/g, " ").trim();
            if(t.length <= tran) return { text: t, catBot: false };
            const dau  = t.slice(0, Math.floor(tran * 0.45));
            const cuoi = t.slice(-Math.floor(tran * 0.25));
            const giua = [];
            let con = tran - dau.length - cuoi.length;
            const cau = t.slice(dau.length, t.length - cuoi.length).split(/(?<=\.)\s+/);
            for(const c of cau){
              if(con <= 0) break;
              if(LOI.test(c)){ giua.push(c.slice(0, con)); con -= c.length; }
            }
            return {
              text: dau + "\n[...]\n" + giua.join(" ") + "\n[...]\n" + cuoi,
              catBot: true
            };
          }

          /* Trả về { toanVan, thuocTinh, nguon } hoặc null nếu không lấy được. */
          async function layToanVan(link){
            if(!link || !/^https?:\/\//i.test(link)) return null;
            let html = "";
            try{
              const r = await doc(link);
              if(!r || !r.text) return null;
              html = r.text;
            }catch(e){ return null; }

            const chu = boThe(html);
            const thuocTinh = {
              soHieu:   layThuocTinh(chu, "Số hiệu"),
              coQuan:   layThuocTinh(chu, "Cơ quan ban hành"),
              ngayBH:   layThuocTinh(chu, "Ngày ban hành"),
              ngayHL:   layThuocTinh(chu, "Ngày hiệu lực"),
              nguoiKy:  layThuocTinh(chu, "Người ký"),
              trichYeu: layThuocTinh(chu, "Trích yếu")
            };

            /* Tìm link tải. Ưu tiên docx vì giải nén được bằng unzip có sẵn. */
            const hrefs = (html.match(/https?:\/\/[^"'\s<>]+/g) || [])
              .map(x => x.replace(/&amp;/g, "&"));
            const linkDocx = hrefs.find(x => /\.docx(\?|$|&)/i.test(x) || /file_name=[^&]*\.docx/i.test(x));
            const linkPdf  = hrefs.find(x => /\.pdf(\?|$|&)/i.test(x)  || /file_name=[^&]*\.pdf/i.test(x));

            let toanVan = "", nguon = "";

            if(linkDocx){
              try{
                chayLenh("curl", ["-sSL", "--max-time", "60", "-A", UA, "-o", "/tmp/vb.docx", linkDocx]);
                const xml = chayLenh("unzip", ["-p", "/tmp/vb.docx", "word/document.xml"]);
                toanVan = String(xml)
                  .replace(/<\/w:p>/g, "\n")
                  .replace(/<[^>]+>/g, "")
                  .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
                  .replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
                if(toanVan.length > 400) nguon = "bản DOCX trên Công báo";
                else toanVan = "";
              }catch(e){ toanVan = ""; }
            }

            if(!toanVan && linkPdf){
              try{
                chayLenh("curl", ["-sSL", "--max-time", "60", "-A", UA, "-o", "/tmp/vb.pdf", linkPdf]);
                toanVan = chayLenh("pdftotext", ["-layout", "-enc", "UTF-8", "/tmp/vb.pdf", "-"]).trim();
                if(toanVan.length > 400) nguon = "bản PDF trên Công báo";
                else toanVan = "";
              }catch(e){ toanVan = ""; }
            }

            /* Không tải được tệp thì vẫn còn phần chữ của trang chi tiết, tốt hơn mỗi tiêu đề. */
            if(!toanVan && chu.length > 800){
              toanVan = chu;
              nguon = "trang chi tiết trên Công báo";
            }
            if(!toanVan) return null;
            return { toanVan, thuocTinh, nguon };
          }

          /* ============================================================
             BA TẦNG KIỂM CHỨNG BẰNG MÁY
             ------------------------------------------------------------
             Có toàn văn rồi thì AI vẫn phải VIẾT LẠI, và chính bước viết lại là chỗ sai lệch.
             Ba tầng dưới đây để máy tự đối chiếu, không đẩy việc đó sang người đọc:
               A. Mọi khẳng định quan trọng phải kèm đoạn trích nguyên văn, máy kiểm tra đoạn
                  trích đó có thật nằm trong toàn văn không.
               B. Máy tự đọc phần điều khoản thi hành để biết văn bản này thay thế hay sửa đổi
                  văn bản nào, rồi nối quan hệ đó với các thẻ đang có trong bảng.
               C. Máy tự trích mức phạt cao nhất và tự kiểm tra nhóm, đối chiếu với AI.
             ============================================================ */

          /* Chuẩn hóa để so khớp: bỏ dấu câu, gộp khoảng trắng, hạ chữ thường. AI thường trích
             lệch chút về dấu phẩy hay viết hoa nên so khớp thô sẽ báo sai oan. */
          function chuanHoa(s){
            return String(s).toLowerCase()
              .replace(/[.,;:!?()\[\]"'“”‘’]/g, " ")
              .replace(/\s+/g, " ").trim();
          }

          /* Kiểm chứng từng đoạn trích. Khớp nguyên đoạn thì đạt; không thì thử tìm một chuỗi
             8 từ liên tiếp của đoạn đó trong toàn văn, đủ để loại các câu AI tự nghĩ ra mà
             không quá khắt khe với sai lệch nhỏ. */
          function kiemChungTrich(toanVan, bangChung){
            const goc = chuanHoa(toanVan);
            const dat = [], truot = [];
            (Array.isArray(bangChung) ? bangChung : []).forEach(b => {
              const t = String(b || "").trim();
              if(t.length < 12) return;
              const c = chuanHoa(t);
              if(goc.includes(c)){ dat.push(t); return; }
              const tu = c.split(" ");
              let thay = false;
              for(let k = 0; k + 8 <= tu.length && !thay; k++){
                if(goc.includes(tu.slice(k, k + 8).join(" "))) thay = true;
              }
              (thay ? dat : truot).push(t);
            });
            return { dat, truot };
          }

          /* Đọc phần điều khoản thi hành để biết văn bản này khai tử hay chỉ sửa văn bản nào.
             Phân biệt hai loại vì hệ quả khác nhau: bị thay thế là hết hiệu lực hoàn toàn, còn
             bị sửa đổi thì vẫn còn hiệu lực nhưng nội dung đã khác. */
          const RE_THAY = /(thay thế|bãi bỏ|hết hiệu lực|ngưng hiệu lực|không còn hiệu lực)/i;
          const RE_SUA  = /(sửa đổi|bổ sung)/i;

          function trichQuanHe(toanVan){
            const thayThe = new Set(), suaDoi = new Set();
            /* Xét theo TỪNG CÂU. Chạy thử bản đầu dùng cửa sổ 400 ký tự quanh từ khóa, và nó
               lấn sang câu kế bên: một nghị định chỉ bị sửa đổi đã bị đánh dấu là thay thế.
               Đánh dấu sai kiểu đó nguy hiểm hơn bỏ sót, vì người đọc sẽ tưởng văn bản còn
               hiệu lực đã chết và bỏ qua nó. Quan hệ pháp lý luôn nằm gọn trong một câu, nên
               tách câu là đúng bản chất. Dấu chấm giữa hai chữ số không tính là hết câu, để
               không cắt vụn các con số như 3.000.000.000. */
            const cau = String(toanVan)
              .replace(/\s+/g, " ")
              .split(/(?<![0-9])\.(?![0-9])|;/);
            for(const c of cau){
              const ma = c.match(new RegExp(CODERE.source, "g")) || [];
              if(!ma.length) continue;
              const coThay = RE_THAY.test(c), coSua = RE_SUA.test(c);
              if(!coThay && !coSua) continue;
              if(coThay && coSua){
                /* Câu có cả hai thì gán theo từ khóa đứng gần mã hơn. */
                const viThay = c.search(new RegExp(RE_THAY.source, "i"));
                const viSua  = c.search(new RegExp(RE_SUA.source, "i"));
                ma.forEach(x => {
                  const viMa = c.indexOf(x);
                  (Math.abs(viMa - viThay) <= Math.abs(viMa - viSua) ? thayThe : suaDoi).add(x);
                });
              }else if(coThay){ ma.forEach(x => thayThe.add(x)); }
              else { ma.forEach(x => suaDoi.add(x)); }
            }
            /* Mã nằm ở cả hai nhóm thì coi là bị thay thế, vì hệ quả nặng hơn. */
            thayThe.forEach(x => suaDoi.delete(x));
            return { thayThe: [...thayThe].slice(0, 12), suaDoi: [...suaDoi].slice(0, 12) };
          }

          /* Tự trích mức phạt tiền cao nhất trong toàn văn. Con số do máy đọc từ bản gốc đáng
             tin hơn con số AI nhớ lại, nên dùng nó để đối chiếu và sửa nếu AI ghi lệch. */
          function trichMucPhat(toanVan){
            const t = String(toanVan).replace(/\s+/g, " ");
            let caoNhat = 0;
            const re = /([\d][\d.,]{5,})\s*(đồng|đ\b)/gi;
            let m;
            while((m = re.exec(t)) !== null){
              const so = parseInt(String(m[1]).replace(/[.,]/g, ""), 10);
              if(!isNaN(so) && so > caoNhat && so <= 100000000000) caoNhat = so;
            }
            const re2 = /([\d]+(?:[.,][\d]+)?)\s*(tỷ|tỉ|triệu)\s*(đồng)?/gi;
            while((m = re2.exec(t)) !== null){
              const n = parseFloat(String(m[1]).replace(",", "."));
              const so = /tỷ|tỉ/i.test(m[2]) ? n * 1e9 : n * 1e6;
              if(so > caoNhat && so <= 100000000000) caoNhat = so;
            }
            if(!caoNhat) return "";
            if(caoNhat >= 1e9){
              const ty = caoNhat / 1e9;
              return (Number.isInteger(ty) ? ty : ty.toFixed(1)) + " tỷ đồng";
            }
            return Math.round(caoNhat / 1e6) + " triệu đồng";
          }

          /* Từ khóa đặc trưng từng nhóm, dùng để tự kiểm tra AI có xếp đúng chỗ không. */
          const TUKHOA_NHOM = {
            kcb:  /(khám bệnh|chữa bệnh|giấy phép hành nghề|phạm vi hoạt động chuyên môn|người hành nghề|hồ sơ bệnh án)/i,
            dn:   /(doanh nghiệp|điều lệ|đăng ký kinh doanh|chủ sở hữu hưởng lợi|người đại diện theo pháp luật)/i,
            pccc: /(phòng cháy|chữa cháy|cứu nạn|cứu hộ|thoát nạn)/i,
            tb:   /(thiết bị y tế|số lưu hành|mỹ phẩm|phiếu công bố|ghi nhãn)/i,
            duoc: /(thuốc|dược|kê đơn|đơn thuốc|gây nghiện|hướng thần|tiền chất|nguyên liệu làm thuốc)/i,
            mt:   /(môi trường|chất thải|nước thải|quan trắc|giấy phép môi trường)/i,
            ld:   /(người lao động|hợp đồng lao động|bảo hiểm xã hội|an toàn.{0,10}lao động|bệnh nghề nghiệp)/i,
            dl:   /(dữ liệu cá nhân|bảo vệ dữ liệu|chủ thể dữ liệu|xử lý dữ liệu)/i,
            ktd:  /(người tiêu dùng|hợp đồng theo mẫu|giám định|hình sự|khiếu nại)/i,
            qc:   /(quảng cáo|người chuyển tải|nội dung quảng cáo)/i,
            antt: /(an ninh, trật tự|an ninh trật tự|điều kiện về an ninh|cơ quan công an)/i,
            gia:  /(niêm yết giá|kê khai giá|hóa đơn|chứng từ điện tử|quản lý thuế)/i
          };
          /* Trả về nhóm hợp lý nhất theo số lần từ khóa xuất hiện. Chỉ dùng để sửa khi AI xếp
             vào nhóm mà toàn văn không hề có dấu vết của nhóm đó. */
          function nhomTheoToanVan(toanVan){
            const t = String(toanVan).slice(0, 60000);
            let tot = "", diem = 0;
            for(const k of Object.keys(TUKHOA_NHOM)){
              const re = new RegExp(TUKHOA_NHOM[k].source, "gi");
              const n = (t.match(re) || []).length;
              if(n > diem){ diem = n; tot = k; }
            }
            return { nhom: tot, diem };
          }

          function curl(url, them, nhanh){
            let goc = "/"; try { goc = new URL(url).origin + "/"; } catch(e) {}
            const thoiGian = nhanh ? ["--max-time","25","--retry","1","--retry-delay","3"]
                                    : ["--max-time","45","--retry","2","--retry-delay","4"];
            const args = ["-sSL","--compressed"].concat(thoiGian).concat([
              "-A", UA,
              "-H","Accept: text/html,application/xhtml+xml,*/*;q=0.8",
              "-H","Accept-Language: vi-VN,vi;q=0.9,en-US;q=0.8",
              "-H","Referer: " + goc]).concat(them||[]).concat([url]);
            return execFileSync("curl", args, { encoding:"utf8", maxBuffer: 60*1024*1024, stdio:["ignore","pipe","pipe"] });
          }

          /* Nhiều cổng thông tin nhà nước (đặc biệt moh.gov.vn, imda.moh.gov.vn) trả "fetch failed" vì
             máy chủ của họ có cấu hình TLS/HTTP2 cũ hoặc lệch chuẩn — curl mặc định gọi HTTP/2 nên hay
             gãy ở đúng chỗ trình duyệt vẫn tự lùi về HTTP/1.1 được. Thử lần lượt nhiều kiểu kết nối,
             kiểu nào qua được thì dừng. Chưa chạy thử thật trên GitHub Actions vì môi trường phát triển
             bị chặn mạng — cần bấm Run workflow một lần để xác nhận kiểu nào thật sự khắc phục được. */
          async function doc(url){
            let loiCuoi = "";
            const kieu = [
              { them: [],                     nhanh:false },
              { them: ["--http1.1"],          nhanh:true  },
              { them: ["-k"],                 nhanh:true  },
              { them: ["--http1.1","-k"],     nhanh:true  },
              { them: ["-4","-k"],            nhanh:true  },
              { them: ["--http1.1","--tlsv1.2","-k"], nhanh:true }
            ];
            /* Ngân sách thời gian cho mỗi nguồn. Nguồn nào chết hẳn (như moh.gov.vn đang
               timeout) thì thử đủ 6 kiểu sẽ ngốn tới 8 phút mà kết quả vẫn hỏng — cắt ở 90
               giây là đủ để các kiểu cứu được TLS/HTTP2 kịp phát huy, mà không treo cả job. */
            const hetHan = Date.now() + 90000;
            for(const kt of kieu){
              if(Date.now() > hetHan){ loiCuoi = (loiCuoi || "không đọc được") + " (dừng sau 90 giây)"; break; }
              try{
                const t = curl(url, kt.them, kt.nhanh);
                if(t && t.length > 400) return { text:t };
                loiCuoi = "trang rỗng";
              }catch(e){
                let err = ""; try { err = (e.stderr||"").toString().trim().split("\n").pop() || ""; } catch(x){}
                loiCuoi = (err || ("mã lỗi " + (e.status === undefined ? "?" : e.status))).slice(0,120);
              }
            }
            try{
              const r = await fetch(url, { redirect:"follow", signal: AbortSignal.timeout(30000), headers:{ "User-Agent": UA } });
              if(r.ok){ const t = await r.text(); if(t && t.length > 400) return { text:t }; }
              else loiCuoi = "HTTP " + r.status;
            }catch(e){}
            return { loi: loiCuoi || "không đọc được" };
          }

          const vn = new Date(Date.now() + 7*3600*1000);
          const p = n => String(n).padStart(2,"0");
          const ngay = p(vn.getUTCDate())+"/"+p(vn.getUTCMonth()+1)+"/"+vn.getUTCFullYear();
          const gio  = p(vn.getUTCHours())+":"+p(vn.getUTCMinutes())+" ngày "+ngay;

          const ketQua = [], moiTim = [];

          /* Quét RSS trước vì đây là nguồn chuẩn nhất và rẻ nhất. */
          console.log("=== QUÉT RSS CÔNG BÁO ===");
          let tongBoSot = 0;
          for(const s of RSS){
            let r; try { r = await doc(s.u); } catch(e){ r = { loi:(e.message||"lỗi").slice(0,120) }; }
            if(r && r.text){
              const { nhan, boSot } = locRSS(r.text);
              const moi = nhan.filter(x => !DA_CO.has(x.code));
              tongBoSot += boSot.length;
              console.log("OK   " + s.n + " — " + moi.length + " văn bản mới, " + boSot.length + " mục không rõ số hiệu");
              boSot.slice(0, 3).forEach(x => console.log("       bỏ qua vì không có số hiệu: " + x));
              ketQua.push({ n:s.n, u:s.u, trangThai:"ok", phatHien: moi.map(x => ({ code:x.code, mota:x.mota })) });
              moi.forEach(x => { if(!moiTim.some(y => y.code === x.code)) moiTim.push(x); });
            }else{
              console.log("LỖI  " + s.n + " — " + (r.loi||"?"));
              ketQua.push({ n:s.n, u:s.u, trangThai:"loi", loi:r.loi||"không đọc được", phatHien:[] });
            }
          }
          if(tongBoSot > 8){
            console.log("Lưu ý: " + tongBoSot + " mục RSS có từ khóa liên quan nhưng không đọc được số hiệu.");
            console.log("Nếu con số này luôn cao thì nên chỉnh lại cách dò số hiệu.");
          }

          console.log("\n=== QUÉT CÁC CỔNG THÔNG TIN ===");
          for(const s of NGUON){
            let r; try { r = await doc(s.u); } catch(e){ r = { loi:(e.message||"lỗi").slice(0,120) }; }
            if(r && r.text){
              const hits = locVanBan(r.text);
              console.log("OK   " + s.n + " — " + hits.length + " văn bản mới");
              ketQua.push({n:s.n, u:s.u, trangThai:"ok", phatHien:hits});
              hits.forEach(x => { if(!moiTim.some(y=>y.code===x.code)) moiTim.push(x); });
            }else{
              console.log("LỖI  " + s.n + " — " + (r.loi||"?"));
              ketQua.push({n:s.n, u:s.u, trangThai:"loi", loi:r.loi||"không đọc được", phatHien:[]});
            }
          }

          try{
            writeFileSync("capnhat.json", JSON.stringify({ngay, gio, daTheoDoi:DA_CO.size, nguon:ketQua}, null, 1), "utf8");
          }catch(e){ console.log("Không ghi được capnhat.json: " + e.message); }

          /* ---------------- PHẦN 2: NHỜ GEMINI PHÂN TÍCH ---------------- */

          const KEY = process.env.GEMINI_API_KEY || "";
          if(!KEY){
            console.log("\nChưa cài GEMINI_API_KEY, bỏ qua bước phân tích.");
            process.exit(0);
          }
          if(!moiTim.length){
            console.log("\nKhông có văn bản mới cần phân tích.");
            process.exit(0);
          }

          /* ---- CHỌN MODEL ----
             Bài học từ lần chạy 08/09/2026: danh sách /models VẪN liệt kê gemini-2.5-flash,
             nhưng gọi thật thì Google trả 404 "no longer available to new users". Nghĩa là
             không được tin danh sách, phải GỌI THẬT mới biết model nào sống. Ở đây chỉ dùng
             danh sách để xếp thứ tự ứng viên, còn model chính thức do lần gọi thành công đầu
             tiên quyết định. Model chết bị loại khỏi danh sách ngay, không thử lại.
             Muốn ép dùng một model cụ thể thì tạo thêm secret GEMINI_MODEL. */
          const MODEL_EP = (process.env.GEMINI_MODEL || "").trim();

          /* Xếp thứ tự ứng viên. Mục tiêu là CHẠY ĐƯỢC MIỄN PHÍ, không phải dùng model xịn nhất.
             Lần chạy #6 cho thấy các model đời mới nhất (gemini-3.8-flash…) trả 429 hết hạn mức,
             nên ở đây ưu tiên bản lite và bản nhỏ trước — chúng rẻ nhất nên khả năng còn nằm
             trong hạn mức miễn phí là cao nhất. Đời mới chỉ là điểm cộng nhẹ, không áp đảo. */
          function diemModel(ten){
            let d = 0;
            if(/lite/.test(ten))    d += 60;          // rẻ nhất, dễ còn hạn mức miễn phí nhất
            if(/flash/.test(ten))   d += 50;          // nhanh, hạn mức rộng
            if(/pro|ultra/.test(ten)) d -= 40;        // đắt, gần như chắc chắn không miễn phí
            const m = ten.match(/gemini-(\d+(?:\.\d+)?)/);
            if(m) d += parseFloat(m[1]) * 3;          // đời mới hơn: cộng nhẹ thôi
            if(/latest/.test(ten))  d += 5;
            if(/preview|exp|thinking/.test(ten)) d -= 20;
            return d;
          }

          let UNGVIEN = [];
          if(MODEL_EP){
            UNGVIEN = [MODEL_EP];
          }else{
            try{
              const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models?key="+KEY, { signal: AbortSignal.timeout(20000) });
              if(r.ok){
                const j = await r.json();
                (j.models || []).forEach(m => {
                  const ten = (m.name || "").replace("models/","");
                  const pp  = m.supportedGenerationMethods || [];
                  if(!ten || !pp.includes("generateContent")) return;
                  if(/image|imagen|tts|audio|embedding|live|native|veo|vision|gemma/i.test(ten)) return;
                  UNGVIEN.push(ten);
                });
                UNGVIEN.sort((a,b) => diemModel(b) - diemModel(a));
              } else { console.log("Không lấy được danh sách model: HTTP " + r.status); }
            }catch(e){ console.log("Không lấy được danh sách model: " + e.message); }
          }
          if(!UNGVIEN.length) UNGVIEN = ["gemini-flash-latest","gemini-2.0-flash","gemini-3-flash"];
          UNGVIEN = UNGVIEN.slice(0, 16);   // để với tới cả model đời cũ, nơi hạn mức miễn phí thường còn

          let MODEL = null;
          console.log("\n=== PHÂN TÍCH ===");
          console.log("Thứ tự model sẽ thử: " + UNGVIEN.join(", "));

          const HD = `Bạn là chuyên gia pháp luật Việt Nam, tư vấn cho GIÁM ĐỐC ĐIỀU HÀNH một BỆNH VIỆN THẨM MỸ tư nhân ở Hà Nội.
          Hãy tra cứu văn bản pháp luật được nêu và trả về DUY NHẤT một đối tượng JSON, không kèm chữ nào khác, không bọc trong khối mã.

          Cấu trúc JSON bắt buộc:
          {
            "lienQuan": true hoặc false,
            "cat": một trong "kcb","antt","dn","pccc","tb","duoc","mt","ld","dl","ktd","qc","gia",
            "tier": 1, 2 hoặc 3,
            "title": "tên ngắn gọn dễ hiểu, không chép nguyên tên hành chính dài",
            "eff": "ngày ban hành và ngày hiệu lực, nêu cả văn bản bị thay thế nếu có",
            "essence": "2 đến 3 câu về bản chất: nó điều chỉnh cái gì và vì sao bệnh viện thẩm mỹ phải quan tâm",
            "duties": ["3 đến 5 việc cụ thể giám đốc điều hành phải làm"],
            "risks": ["2 đến 4 rủi ro nếu làm sai, nêu mức phạt cụ thể nếu biết"],
            "fine": "mức phạt tối đa dạng ngắn ví dụ 200 triệu đồng, để chuỗi rỗng nếu không rõ",
            "fineNote": "một dòng giải thích con số trên",
            "notes": "một lưu ý thực chiến, để chuỗi rỗng nếu không có",
            "url": "đường dẫn tới toàn văn trên trang chính thống, để chuỗi rỗng nếu không chắc",
            "bangChung": ["chỉ điền khi được cung cấp toàn văn, xem quy tắc bên dưới"]
          }

          Quy tắc:
          - lienQuan = false nếu văn bản KHÔNG liên quan tới vận hành bệnh viện thẩm mỹ. Khi đó các trường khác để rỗng.
          - Ý nghĩa nhóm: kcb khám chữa bệnh và giấy phép, antt an ninh trật tự gồm giấy chứng nhận đủ điều kiện an ninh trật tự do công an cấp, gia giá và hóa đơn gồm niêm yết giá kê khai giá hóa đơn điện tử, dn doanh nghiệp, pccc phòng cháy chữa cháy, tb thiết bị y tế và mỹ phẩm, duoc thuốc và dược gồm nguồn gốc thuốc kê đơn thuốc kiểm soát đặc biệt, mt môi trường và chất thải, ld lao động và bảo hiểm, dl dữ liệu cá nhân, ktd người tiêu dùng và trách nhiệm hình sự, qc quảng cáo.
          - tier 1 nếu sai có thể bị đình chỉ hoạt động hoặc truy cứu hình sự, tier 2 nếu phạt tiền nặng hoặc tước giấy phép, tier 3 nếu chỉ là nền tảng cần biết.
          - Viết tiếng Việt tự nhiên, câu ngắn, không dùng dấu gạch ngang giữa câu, không dùng dấu ngoặc kép bên trong nội dung.
          - Nếu không tra được văn bản, đặt lienQuan = false.`;

          /* Bản hướng dẫn dùng khi KHÔNG được tra cứu web. Với nội dung pháp luật, bịa đặt
             nguy hiểm hơn là bỏ trống, nên ở chế độ này phải siết chặt: cấm suy đoán số điều,
             mức phạt, ngày hiệu lực. Không chắc thì để trống, không đủ thông tin thì loại. */
          const HD_KHONG_WEB = HD + `

          RẤT QUAN TRỌNG cho lần trả lời này: bạn KHÔNG được tra cứu internet.
          Chỉ dùng đúng thông tin trong tên văn bản đã cho, cộng với kiến thức mà bạn chắc chắn.
          Tuyệt đối không bịa số điều khoản, không bịa mức phạt, không bịa ngày ban hành hay ngày hiệu lực.
          Trường nào không chắc thì để chuỗi rỗng, kể cả trường eff và fine.
          Nếu thông tin quá ít để nói được điều gì thực sự có ích, đặt lienQuan bằng false.`;

          /* Gọi một model cụ thể. traWeb quyết định có kèm công cụ tra cứu Google hay không.
             Trả về {ok:true, data} hoặc {ok:false, status, text}. */
          /* Hướng dẫn khi ĐÃ CÓ toàn văn. Đây là chế độ tốt nhất: không cần tra web, không cần
             model nhớ gì, chỉ cần đọc bản gốc nằm ngay trong câu hỏi. Chất lượng tiệm cận thẻ
             viết tay vì nguồn dữ liệu giống hệt nhau — bản gốc của văn bản. */
          const HD_CO_TOANVAN = HD + `

          Lần này bạn được cung cấp TOÀN VĂN của văn bản ngay trong câu hỏi.
          Chỉ được dựa vào toàn văn đó, không dùng trí nhớ, không suy đoán, không tra cứu.
          Mọi con số bạn nêu phải trích từ toàn văn: mức phạt, số điều khoản, ngày hiệu lực,
          tên văn bản bị thay thế hoặc bãi bỏ.
          Nếu toàn văn có ghi chú đã bị cắt bớt, chỉ kết luận trong phạm vi phần được cung cấp,
          và không khẳng định điều gì về phần bị cắt.
          Điều nào toàn văn không nói thì để chuỗi rỗng, tuyệt đối không lấp bằng phỏng đoán.

          BẮT BUỘC thêm một trường nữa vào JSON:
            "bangChung": [từ 2 đến 5 đoạn TRÍCH NGUYÊN VĂN từ toàn văn, mỗi đoạn 1 đến 3 câu]
          Quy tắc cho bangChung:
          - Phải sao y nguyên chữ trong toàn văn, không diễn đạt lại, không rút gọn, không sửa
            dấu câu. Hệ thống sẽ đối chiếu từng đoạn với bản gốc bằng máy, đoạn nào không tìm
            thấy sẽ bị loại và mục này bị đánh dấu là kém tin cậy.
          - Ưu tiên trích đúng những câu chứa con số bạn đã nêu: mức phạt, thời hạn, ngày hiệu
            lực, và câu nói rõ văn bản nào bị thay thế hoặc bãi bỏ.
          - Nếu không trích được câu nào chứng minh cho một con số, hãy bỏ con số đó khỏi câu
            trả lời thay vì cố giữ.`;

          async function goiMot(model, v, traWeb){
            const coTV = !!v.toanVan;
            const nhacViec = coTV
              ? ("Văn bản cần phân tích: " + (v.code || "chưa rõ số hiệu") + "\n"
                 + (v.thuocTinh ? "Thuộc tính chính thức lấy từ Công báo:\n"
                     + "  Số hiệu: " + (v.thuocTinh.soHieu || "-") + "\n"
                     + "  Cơ quan ban hành: " + (v.thuocTinh.coQuan || "-") + "\n"
                     + "  Ngày ban hành: " + (v.thuocTinh.ngayBH || "-") + "\n"
                     + "  Ngày hiệu lực: " + (v.thuocTinh.ngayHL || "-") + "\n" : "")
                 + (v.catBot ? "\nLƯU Ý: toàn văn dưới đây ĐÃ BỊ CẮT BỚT phần giữa, chỗ cắt đánh dấu bằng [...].\n" : "")
                 + "\n--- TOÀN VĂN ---\n" + v.toanVan + "\n--- HẾT TOÀN VĂN ---")
              : ("Văn bản cần phân tích:\n" + v.code + " — " + v.mota);

            const body = {
              systemInstruction: { parts: [{ text: coTV ? HD_CO_TOANVAN : (traWeb ? HD : HD_KHONG_WEB) }] },
              contents: [{ role:"user", parts:[{ text: nhacViec }]}],
              generationConfig: { temperature: 0.2, maxOutputTokens: 2048 }
            };
            /* Có toàn văn rồi thì không cần công cụ tra cứu Google nữa — vừa chính xác hơn vì
               đọc bản gốc thay vì bài viết thứ cấp, vừa không tiêu hạn mức tra web vốn rất hẹp. */
            if(traWeb && !coTV) body.tools = [{ google_search: {} }];
            let r;
            try{
              r = await fetch(
                "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + KEY,
                { method:"POST", headers:{ "Content-Type":"application/json" },
                  body: JSON.stringify(body), signal: AbortSignal.timeout(90000) });
            }catch(e){ return { ok:false, status:0, text:(e.message||"lỗi mạng").slice(0,160) }; }

            if(!r.ok){
              const t = await r.text().catch(()=> "");
              return { ok:false, status:r.status, text:t.slice(0,200).replace(/\s+/g," ") };
            }
            const j = await r.json();
            const parts = ((j.candidates||[])[0]||{}).content;
            let txt = ((parts && parts.parts) || []).map(x => x.text || "").join("").trim();
            txt = txt.replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
            const a = txt.indexOf("{"), b = txt.lastIndexOf("}");
            if(a < 0 || b < a) return { ok:false, status:200, text:"không tìm thấy JSON trong câu trả lời" };
            try { return { ok:true, data: JSON.parse(txt.slice(a, b+1)) }; }
            catch(e){ return { ok:false, status:200, text:"JSON hỏng: " + (e.message||"").slice(0,80) }; }
          }

          let HET_QUOTA = false;   // bật lên khi MỌI model đều báo hết hạn mức
          let TRA_WEB   = true;    // tắt khi phát hiện hạn mức tra cứu web đã cạn

          async function hoiGemini(v){
            const thu = MODEL ? [MODEL] : UNGVIEN.slice();
            if(!thu.length) throw new Error("không còn model nào khả dụng");
            let loiCuoi = "", so429 = 0, soLoai = 0, soThu = 0;

            for(const m of thu){
              soThu++;
              let kq = await goiMot(m, v, TRA_WEB);

              /* Thủ phạm thật của 429 ở lần chạy #6 và #7: công cụ tra cứu Google kèm theo có
                 hạn mức RIÊNG và rất thấp trên gói miễn phí, thấp hơn nhiều so với hạn mức gọi
                 model thường. Nên khi dính 429 lúc đang bật tra web, thử lại ngay cùng model mà
                 bỏ tra web — nếu qua được thì thủ phạm đúng là nó, và cả phiên chuyển sang chạy
                 không tra web. Đổi lại phải siết prompt để model không bịa, xem HD_KHONG_WEB. */
              if(!kq.ok && kq.status === 429 && TRA_WEB){
                console.log("   " + m + ": hết hạn mức TRA CỨU WEB, thử lại không tra web");
                kq = await goiMot(m, v, false);
                if(kq.ok){
                  TRA_WEB = false;
                  console.log("   → chuyển sang chế độ không tra web cho cả phiên");
                }
              }

              if(kq.ok){
                if(!MODEL){ MODEL = m; console.log("→ Model đang dùng: " + m + (TRA_WEB ? " (có tra web)" : " (không tra web)")); }
                if(!TRA_WEB) kq.data.khongTraWeb = true;
                return kq.data;
              }
              loiCuoi = "HTTP " + kq.status + " " + kq.text;

              /* 404 và 400: model không tồn tại hoặc khoá không được phép dùng — loại hẳn. */
              if(kq.status === 404 || kq.status === 400){
                soLoai++;
                UNGVIEN = UNGVIEN.filter(x => x !== m);
                console.log("   loại model " + m + " — " + kq.text.slice(0,90));
                if(MODEL === m) MODEL = null;
                continue;
              }

              /* 429: hết hạn mức. Bài học lần chạy #6 — các model đời mới nhất không nằm trong
                 hạn mức miễn phí, nên phải THỬ MODEL KHÁC chứ không bỏ cuộc. Không loại vĩnh
                 viễn vì hạn mức hồi lại theo thời gian, chỉ bỏ qua trong lần chạy này. */
              if(kq.status === 429){
                so429++;
                console.log("   model " + m + " hết hạn mức, thử model khác");
                if(MODEL === m) MODEL = null;
                await new Promise(s => setTimeout(s, 1500));
                continue;
              }

              break;   // 500, lỗi mạng, hết giờ: không phải lỗi model, để vòng ngoài thử lại
            }

            /* Mọi ứng viên còn dùng được đều 429 nghĩa là hết hạn mức ở mức TÀI KHOẢN, không
               phải mức model. Bật cờ để dừng hẳn.
               Lỗi ở lần chạy #7: điều kiện cũ là so429 === soThu, nhưng soThu tính cả model bị
               loại vì 404, nên khi có model 404 xen vào thì cờ không bao giờ bật — máy thử lại
               vòng hai, đốt 32 lượt gọi thay vì 16. Trừ số bị loại ra là đúng. */
            if(so429 > 0 && so429 === (soThu - soLoai)){
              HET_QUOTA = true;
              console.log("\n!!! Toàn bộ " + so429 + " model đều báo hết hạn mức.");
              console.log("    Đây là giới hạn ở mức tài khoản Google, không phải lỗi của máy quét.");
              console.log("    Cách xử lý: đợi hạn mức hồi theo ngày, hoặc tạo khoá mới từ một");
              console.log("    project Google khác, hoặc bật billing cho project đang dùng.");
            }
            throw new Error(loiCuoi || "không gọi được");
          }

          const NHOM = ["kcb","antt","dn","pccc","tb","duoc","mt","ld","dl","ktd","qc","gia"];
          let them = 0;
          for(const v of moiTim){
            if(DA_PHANTICH.some(x => x.code === v.code)) continue;
            if(HET_QUOTA){
              console.log("BỎ QUA " + v.code + " — đã hết hạn mức, dừng gọi để khỏi đốt thêm");
              continue;
            }
            /* Lấy toàn văn TRƯỚC khi hỏi AI. Đây là thay đổi quyết định chất lượng: có bản gốc
               thì AI đọc mà trả lời, không có thì mới phải đoán từ tiêu đề. */
            let tv = null;
            try { tv = await layToanVan(v.link); } catch(e){ tv = null; }
            if(tv){
              const cat = catThongMinh(tv.toanVan, 30000);
              v.toanVan   = cat.text;
              v.catBot    = cat.catBot;
              v.thuocTinh = tv.thuocTinh;
              v.nguonTV   = tv.nguon;
              console.log("       đã lấy toàn văn " + v.code + " (" + tv.nguon + ", "
                          + tv.toanVan.length + " ký tự" + (cat.catBot ? ", có cắt bớt" : "") + ")");
            }else{
              console.log("       KHÔNG lấy được toàn văn " + v.code + ", sẽ phân tích theo tiêu đề");
            }

            let kq = null, loi = "";
            for(let lan = 1; lan <= 2; lan++){
              try { kq = await hoiGemini(v); break; }
              catch(e){
                loi = e.message;
                if(HET_QUOTA) break;                       // hết hạn mức thì thử lại cũng vô ích
                await new Promise(s => setTimeout(s, 4000));
              }
            }
            if(!kq){ console.log("BỎ QUA " + v.code + " — " + loi); continue; }
            if(!kq.lienQuan){ console.log("LOẠI   " + v.code + " — không liên quan bệnh viện thẩm mỹ"); continue; }
            if(!NHOM.includes(kq.cat)) kq.cat = "kcb";
            kq.code = v.code;
            kq.napLuc = gio;

            /* Dữ kiện lấy từ bảng thuộc tính của Công báo là sự thật, còn phần AI viết chỉ là
               diễn giải. Nên ngày tháng và cơ quan ban hành ghi đè lên những gì AI trả về —
               loại bỏ hẳn khả năng bịa ngày hiệu lực, thứ nguy hiểm nhất trong một bảng pháp lý. */
            const tt = v.thuocTinh;
            if(tt && (tt.ngayBH || tt.ngayHL)){
              const phan = [];
              if(tt.ngayBH) phan.push("Ban hành " + tt.ngayBH);
              if(tt.ngayHL) phan.push("hiệu lực " + tt.ngayHL);
              kq.eff = phan.join(" · ");
              if(tt.coQuan) kq.eff += " · " + tt.coQuan;
            }
            if(v.link) kq.url = v.link;

            /* Ghi lại đã đọc bản gốc hay chưa, để trang web nói thật với người dùng. */
            kq.coToanVan = !!v.toanVan;
            kq.nguonTV   = v.nguonTV || "";
            kq.catBot    = !!v.catBot;
            if(v.toanVan) delete kq.khongTraWeb;   // có bản gốc thì không còn là suy đoán

            /* ---- BA TẦNG KIỂM CHỨNG, chỉ chạy khi có bản gốc để đối chiếu ---- */
            if(v.toanVan){
              /* A. Bằng chứng trích dẫn. */
              const kc = kiemChungTrich(v.toanVan, kq.bangChung);
              kq.bangChung = kc.dat;
              kq.soTrichDat = kc.dat.length;
              kq.soTrichTruot = kc.truot.length;
              const tongTrich = kc.dat.length + kc.truot.length;
              kq.tinCay = tongTrich === 0 ? "khong-trich"
                        : kc.truot.length === 0 ? "cao"
                        : kc.dat.length >= kc.truot.length ? "vua" : "thap";
              if(kc.truot.length){
                console.log("       " + kc.truot.length + "/" + tongTrich
                            + " đoạn trích KHÔNG tìm thấy trong bản gốc, đã loại");
                kc.truot.slice(0,2).forEach(x => console.log("         loại: " + x.slice(0,80)));
              }

              /* B. Quan hệ hiệu lực: văn bản này khai tử hay sửa văn bản nào. */
              const qh = trichQuanHe(v.toanVan);
              kq.thayThe = qh.thayThe.filter(x => x !== v.code);
              kq.suaDoi  = qh.suaDoi.filter(x => x !== v.code);
              if(kq.thayThe.length) console.log("       thay thế: " + kq.thayThe.join(", "));
              if(kq.suaDoi.length)  console.log("       sửa đổi:  " + kq.suaDoi.join(", "));

              /* C1. Mức phạt do máy đọc từ bản gốc. Lệch với AI thì tin máy. */
              const phatMay = trichMucPhat(v.toanVan);
              if(phatMay){
                const soAI  = String(kq.fine || "").replace(/[^\d]/g, "");
                const soMay = phatMay.replace(/[^\d]/g, "");
                if(!kq.fine || soAI !== soMay){
                  if(kq.fine) console.log("       mức phạt AI ghi " + kq.fine + ", máy đọc được " + phatMay + " — dùng số của máy");
                  kq.fine = phatMay;
                  kq.fineNote = "mức tiền cao nhất máy đọc được trong toàn văn, cần xem điều khoản cụ thể để biết áp cho hành vi nào";
                }
              }

              /* C2. Nhóm: chỉ sửa khi toàn văn không có dấu vết của nhóm AI chọn. */
              const nt = nhomTheoToanVan(v.toanVan);
              const reAI = TUKHOA_NHOM[kq.cat];
              const coDauVet = reAI ? reAI.test(v.toanVan) : false;
              if(!coDauVet && nt.nhom && nt.diem >= 3){
                console.log("       nhóm AI chọn (" + kq.cat + ") không khớp toàn văn, đổi sang " + nt.nhom);
                kq.cat = nt.nhom;
              }
            }

            DA_PHANTICH.push(kq);
            them++;
            console.log("THÊM   " + v.code + " → nhóm " + kq.cat + ", mức " + kq.tier
                        + (v.toanVan ? " [đọc toàn văn]" : " [chỉ tiêu đề]") + " — " + (kq.title||""));
            await new Promise(s => setTimeout(s, 2500));
          }

          try{
            writeFileSync("vanban-moi.json", JSON.stringify(DA_PHANTICH, null, 1), "utf8");
            console.log("\nĐã ghi vanban-moi.json. Thêm mới " + them + ", tổng " + DA_PHANTICH.length + " văn bản tự động.");
          }catch(e){ console.log("Không ghi được vanban-moi.json: " + e.message); }
          SCRIPT
          node /tmp/quet.mjs || echo "Máy quét gặp lỗi, giữ nguyên kết quả cũ."

      - name: Lưu kết quả vào repo
        continue-on-error: true
        run: |
          git config user.name  "may-quet-luat"
          git config user.email "actions@github.com"
          git add capnhat.json vanban-moi.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Không có thay đổi, không cần lưu."
          else
            git commit -m "Cập nhật kết quả quét" || true
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "Đã lưu."; break; fi
              echo "Đẩy lần $i thất bại, thử lại…"; sleep 5
            done
          fi
